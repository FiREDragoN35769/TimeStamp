<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>TimeStamp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="prevDay" class="nav-btn" type="button">‹ Previous</button>
      <div class="title-wrap">
        <h1 id="dayTitle">Today</h1>
        <p>Type times directly. Totals update automatically.</p>
      </div>
      <button id="nextDay" class="nav-btn" type="button">Next ›</button>
    </header>

    <section class="timesheet-card">
      <div class="sheet-head row-grid">
        <div>#</div><div>IN</div><div>OUT</div><div>HOURS</div>
      </div>
      <div id="rows" class="rows"></div>

      <div class="add-row-wrap">
        <button id="addTimeBtn" type="button" class="add-time">+ Add new time</button>
      </div>

      <div class="totals">
        <div><span>Total</span><strong id="totalHM">0:00</strong></div>
        <div><span>Decimal</span><strong id="totalDecimal">0.00</strong></div>
      </div>

      <div class="sheet-actions">
        <button id="clearDay" type="button" class="secondary">Clear Day</button>
        <button id="finishBtn" type="button" class="primary">Finish</button>
      </div>
      <p id="error" class="error" aria-live="polite"></p>
    </section>

    <section id="summaryView" class="summary-card hidden">
      <div class="summary-head">
        <div>
          <h2>All Days</h2>
          <p>Every saved day with vertical totals.</p>
        </div>
        <button id="backToDay" type="button" class="secondary small">Back</button>
      </div>
      <div id="summaryList" class="summary-list"></div>
      <div class="grand-total">
        <span>All Days Total</span>
        <div><small>H:MM</small><strong id="grandHM">0:00</strong></div>
        <div><small>Decimal</small><strong id="grandDecimal">0.00</strong></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
