<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>TimeStamp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>TimeStamp</h1>
      <p class="subtitle">Calculate hours and minutes worked.</p>
      <div class="grid">
        <label>Clock in<input id="clockIn" type="time" /></label>
        <label>Clock out<input id="clockOut" type="time" /></label>
      </div>
      <label>Break minutes<input id="breakMinutes" type="number" min="0" step="1" value="0" inputmode="numeric" /></label>
      <div class="actions">
        <button id="calculateBtn" type="button">Calculate</button>
        <button id="clearBtn" type="button" class="secondary">Clear</button>
      </div>
      <section id="result" class="result" aria-live="polite">
        <span class="result-label">Total worked</span>
        <strong id="totalTime">0 hours 0 minutes</strong>
        <span id="decimalHours">0.00 hours</span>
      </section>
      <p id="error" class="error" role="alert"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
