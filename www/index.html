<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>TimeStamp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="brand-header"><div class="brand-emblem">⌛</div><div><h1>TimE StamP</h1><p>TIME TODAY ✦ A BETTER TOMORROW</p></div></header>
    <div class="employee-bar"><label for="employeeSelect">Employee</label><select id="employeeSelect"></select><button id="addEmployee" type="button">+ Add</button><button id="deleteEmployee" type="button">Delete</button></div>
    <header class="topbar">
      <button id="prevDay" class="nav-btn" type="button">‹ Previous</button>
      <div class="title-wrap">
        <h1 id="dayTitle">Today</h1>
        <p>Type times directly. Totals update automatically.</p>
      </div>
      <button id="nextDay" class="nav-btn" type="button">Next ›</button>
    </header>

    <section class="timesheet-card">
      <div class="sheet-head row-grid">
        <div>#</div><div>IN</div><div>OUT</div><div>HOURS</div>
      </div>
      <div id="rows" class="rows"></div>
      <div id="addRowsHost" class="add-row-wrap"></div>

      <div class="totals">
        <div><span>Total</span><strong id="totalHM">0:00</strong></div>
        <div><span>Decimal</span><strong id="totalDecimal">0.00</strong></div>
      </div>

      <div class="sheet-actions">
        <button id="clearDay" type="button" class="secondary">Clear Day</button>
        <button id="finishBtn" type="button" class="primary">Finish</button>
      </div>
      <p id="error" class="error" aria-live="polite"></p>
    </section>

    <section id="summaryView" class="summary-card hidden">
      <div class="summary-head">
        <div>
          <h2>Weekly Timesheet</h2>
          <p>Hours for the selected employee and week.</p>
        </div>
        <button id="backToDay" type="button" class="secondary small">Back</button>
      </div>
      <div id="summaryList" class="summary-list"></div>
      <div class="grand-total">
        <span>Week Total</span>
        <div><small>H:MM</small><strong id="grandHM">0:00</strong></div>
        <div><small>Decimal</small><strong id="grandDecimal">0.00</strong></div>
      </div>
      <div class="pay-row">
        <label class="pay-box">
          <span>Hourly Rate</span>
          <div class="money-input"><span>$</span><input id="hourlyRate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" /></div>
        </label>
        <div class="pay-box pay-result">
          <span>Weekly Pay</span>
          <strong id="weeklyPay">$0.00</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
